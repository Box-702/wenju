# =====================================================================
# ci.yml —— 后端测试 + 静态检查 + 提示词质量 eval + 前端构建
#
# push / PR 跑三个 job，并行、任一失败即标红：
#   backend / eval-offline / frontend。
#
# backend 里含一步 ruff 致命集检查（E9/F63/F7/F82/B）：
# 只拦真 bug，不拦行宽与导入序那几百条存量债。
#
# eval 分两层，CI 只跑免费的那层：
#   - eval-offline：不需要任何 key，验证断言库、judge 解析器、case 完整性，
#     以及「用录制的真实产出跑断言」——锁住审计器不误报。**每次 push 都跑。**
#   - 在线层（真实链路，11 case × 3 个工种，约 100+ 次模型调用、几十分钟）
#     不进 CI：D-48 后模型配置只走本机 DB，CI 上没有可用配置；改完提示词
#     在本地跑 `python -m evals.run`（付费动作，见 AGENTS.md）。
# =====================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步依赖
        run: uv sync --frozen

      - name: 静态检查（致命集）
        # 只跑致命集：语法错误、未定义名、bugbear。
        # 全量规则（E501 行长 348 处、I001 导入序 39 处）欠着债，
        # 一次全开会红到没人愿意修——先让「真 bug 会被拦住」这件事成立。
        run: uv run ruff check --select E9,F63,F7,F82,B app tests evals

      - name: 跑测试
        run: uv run pytest tests -q

  eval-offline:
    name: 提示词 eval（离线层）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步依赖
        run: uv sync --frozen

      # 不需要任何模型 key：只跑断言库、解析器与录制 fixture 的回归层。
      # 在线层默认关闭（conftest 里 skip），这里再用 -m 显式排除，双保险。
      - name: 跑离线 eval
        run: uv run pytest evals -q -m "not online"


  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
